<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sales reporting dashboard: revenue summaries and Chart.js visualisations. Part of the AI stock forecasting capstone." />
  <title>Sales Dashboard — sohail-ahmed.space</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <h1>Sales Dashboard</h1>
    <nav class="topnav" aria-label="Site">
      <a href="index.html" aria-current="page">Sales</a>
      <a href="stocks.html">Stocks</a>
    </nav>
    <span class="spacer"></span>
    <button class="btn" data-theme-toggle aria-pressed="false" title="Toggle dark mode">🌙 Dark</button>
  </header>

  <main>

    <!-- KPI summary cards — values are filled in by app.js -->
    <section class="kpi-cards" aria-label="Summary" aria-live="polite">
      <div class="card">
        <h2>Total Revenue</h2>
        <p class="kpi-value loading" id="kpi-revenue">—</p>
      </div>
      <div class="card">
        <h2>Total Units Sold</h2>
        <p class="kpi-value loading" id="kpi-units">—</p>
      </div>
      <div class="card">
        <h2>Top Product</h2>
        <p class="kpi-value loading" id="kpi-top-product">—</p>
      </div>
      <div class="card">
        <h2>Top Region</h2>
        <p class="kpi-value loading" id="kpi-top-region">—</p>
      </div>
    </section>

    <!-- AI-generated insights card — text is loaded from insights.json -->
    <section class="chart-section">
      <h2>AI Insights <span class="tag">(AI-generated)</span></h2>
      <p id="ai-insights">Loading insights...</p>
    </section>

    <!-- Each <canvas> is a Chart.js drawing surface.
         The id must match what app.js uses to find the element. -->

    <section class="chart-section">
      <h2>Monthly Revenue</h2>
      <div class="chart-wrap"><canvas id="chart-monthly"></canvas></div>
    </section>

    <section class="chart-section">
      <h2>Revenue by Product</h2>
      <div class="chart-wrap"><canvas id="chart-product"></canvas></div>
    </section>

    <section class="chart-section">
      <h2>Revenue by Region</h2>
      <div class="chart-wrap"><canvas id="chart-region"></canvas></div>
    </section>

  </main>

  <footer class="site">
    <span>Course baseline sales dashboard.</span>
    <span class="dot">See also the <a href="stocks.html">stock forecasting page</a>.</span>
  </footer>

  <!-- Chart.js loaded from a CDN — no npm or build step required.
       It must come BEFORE app.js so the Chart object is available. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="theme.js"></script>
  <script src="app.js"></script>

</body>
</html>
