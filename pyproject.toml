[project]
name = "data-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "paramiko>=3.0",
    "google-genai>=1.0",
    "yfinance>=1.7.0",
    "statsmodels>=0.15.0",
    "numpy>=2.4.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
