name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest tests/ -q
        # Stocks pipeline needs no secrets (Gemini falls back to rule-based).
      - run: uv run python -m src.build
      - run: uv run python -m src.insights
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: assemble site
        run: |
          rm -rf _site && mkdir -p _site/output
          cp dashboard/index.html dashboard/stocks.js dashboard/theme.js dashboard/style.css dashboard/CNAME _site/
          cp -r output/stocks _site/output/stocks
          echo "sohail-ahmed.space" > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
